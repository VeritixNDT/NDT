name: CI

# Static analysis gate for the app. Step 5 of the cross-file globals safety net
# (docs/superpowers/specs/2026-07-28-globals-safety-net-design.md).
#
# js/*.js are plain <script> files sharing one global namespace, so a typo'd or
# renamed global used to be invisible to lint and fail only when a user clicked
# the control that called it. `npm run lint` regenerates the globals manifest
# and runs ESLint with no-undef on, which turns that class of bug into a build
# failure. `npm test` guards the analyser itself against silently degrading
# into a no-op — a checker that reports nothing is worse than no checker.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch: {}

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 22+ required: tools/symbols.mjs uses import.meta.filename.
          node-version: '24'
          cache: npm

      - name: Install dev tooling
        # The Playwright browser download (~100s of MB) is pure waste here —
        # this job runs ESLint and the node:test suite, never the browser
        # harness. Scripts still run, so nothing else is skipped.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Analyser tests
        run: npm test

      - name: Lint (regenerates the globals manifest, then runs ESLint)
        # Covers js/ AND tools/ — the Playwright harnesses contain browser code
        # in their page.evaluate callbacks and are checked against the app's
        # real global surface, so a typo there fails here too.
        run: npm run lint

      - name: Globals manifest is committed up to date
        # `npm run lint` regenerated it above, so any diff means someone added
        # or removed a global without committing the regenerated file. Lint
        # still passed — but a stale committed copy gives every editor false
        # no-undef squiggles until it is refreshed.
        run: |
          if ! git diff --exit-code --stat tools/globals.generated.json; then
            echo "::error title=Stale globals manifest::tools/globals.generated.json is out of date. Run 'npm run lint' and commit the result."
            exit 1
          fi

  # Static analysis proves the code resolves; this proves it actually draws.
  # Runs in parallel so the fast lint feedback is not held up by the browser
  # install. Every page and settings subsection is opened and asserted to have
  # rendered — the app-level regression net that did not exist before.
  browser-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dev tooling
        # Still skipped here: the postinstall would fetch Firefox and WebKit
        # too. Only Chromium is installed, explicitly, below.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Cache Chromium
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system deps
        # The cache holds the browser binaries but not the apt packages they
        # link against, so these are needed even on a cache hit.
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Harness tests
        # These skip in the static-analysis job (no browser); here they run.
        run: node --test "tools/verify.test.mjs"

      - name: Render every page and settings section
        run: npm run verify:all -- --shots .verify-out/pages

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verify-screenshots
          path: .verify-out/pages
          retention-days: 7
