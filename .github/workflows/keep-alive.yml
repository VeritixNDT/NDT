name: Keep Supabase awake

# Supabase free tier pauses a project after 7 days with no API activity.
# This makes a tiny read against the REST API every 3 days to reset that timer.
# Runs on GitHub's free scheduled runners; also runnable on demand from the
# Actions tab (Run workflow).

on:
  schedule:
    - cron: '23 6 */3 * *'   # 06:23 UTC, every 3 days (well inside the 7-day window)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://mmgdqsilgwusehsqgyyj.supabase.co/rest/v1/orgs?select=id&limit=1" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY")
          echo "Supabase responded HTTP $code"
          # 200 (rows or empty) or 401/403 all still count as activity; only a
          # network failure is a real problem.
          if [ -z "$code" ] || [ "$code" = "000" ]; then
            echo "No response from Supabase"; exit 1
          fi
