# ─────────────────────────────────────────────────────────────────────────────
# Netlify — Veritix NDT Inspect (static, hash-routed SPA; no build step)
#
# Connect this repo in Netlify (Add new site → Import an existing project →
# pick the GitHub repo). No build tooling is required.
#
# The "build" below just copies the app into a clean publish dir so ONLY the
# app ships — the repo's docs, supabase/ function source, tools/ and package
# files are NOT exposed on the public site. The app HTML is published as
# index.html so the site serves at "/" with a clean URL (the ugly
# veritix-…v3_44.html name never appears in the address bar).
#
# After the first deploy, point the custom domain veritix.io at the site
# (Netlify → Domain settings) and set the Supabase secret:
#     APP_URL = "https://veritix.io"
# so portal/invite links are minted against the real domain.
# ─────────────────────────────────────────────────────────────────────────────

[build]
  publish = "dist"
  command = "rm -rf dist && mkdir -p dist && cp veritix-ndt-inspect-v3_44.html dist/index.html && cp -r js css dist/"

# SPA fallback: serve the app for "/" and any path. Real assets (/js/*, /css/*)
# are served first; everything else falls back to the app, which then reads the
# #/… hash route (e.g. #/portal/<token>).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Light, safe hardening for a public SaaS frontend.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Cache freshness — the app is an audit tool; a browser must never run stale
# code. "no-cache" means the browser MAY store the file but MUST revalidate it
# with the server on every load (ETag → cheap 304 when unchanged, fresh bytes
# the instant a deploy changes them). This closes the HTTP-cache path that let
# old js/*.js linger after a deploy.
#
# These headers are the ONLY thing providing deploy freshness. This comment used
# to add "(The service worker is network-first and its cache name is versioned
# per build — see vxRegisterServiceWorker.)" — there is no service worker. The
# app registered two and got zero; both were measured to be impossible and were
# deleted on 2026-07-30. See the header of js/platform-boot.js.
#
# For anyone adding a real one later: the SPA fallback above (`/*` → /index.html,
# 200) swallows /sw.js and serves it as text/html, which browsers reject as a
# worker script. A real service worker needs its own redirect exception AND to be
# copied into dist/ by the build command above — it is neither today.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "no-cache"
